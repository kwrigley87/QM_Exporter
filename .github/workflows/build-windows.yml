name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          pyinstaller --clean --onefile --windowed --name QM_Exporter --hidden-import cryptography --hidden-import tkcalendar quality_question_gui3.py

      - name: List dist files
        run: |
          dir dist

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: QM_Exporter-Windows
          path: dist/QM_Exporter.exe
